            - Управление приложениями: beeatlas-docs/admin/applications.md
            - Управление технологиями: beeatlas-docs/admin/technologies.md
            - Управление критериями: beeatlas-docs/admin/criteria.md
            - Управление кастомными фитнес-функциями: beeatlas-docs/admin/fitness_functions.md
            - Импорт файлов: beeatlas-docs/admin/file_import.md
            - Процесс импорта: beeatlas-docs/admin/import_process.md
            - Управление возможностями: beeatlas-docs/admin/capabilities.md
            - Staging (наблюдаемость и поиск): beeatlas-docs/admin/staging.md
    - Уведомления: beeatlas-docs/notifications.md
    - Модели (детально):
