      - ФДМ: beeatlas-docs/models/fdm.md
      - Технорадар: beeatlas-docs/models/tech-radar.md
      - Карта возможностей: beeatlas-docs/models/map.md
      - Каталог приложений: beeatlas-docs/models/apps.md
      - E2E сценарии: beeatlas-docs/models/e2e.md
