openapi: 3.0.3
info:
  title: FDM Gateway API Specification
  description: |
    OpenAPI спецификация для fdm-gateway — единой точки входа в экосистему FDM.
    Все запросы к микросервисам проходят через шлюз с HMAC-аутентификацией.
    Маршрутизация осуществляется по префиксу пути к соответствующему бэкенд-сервису.
  version: 1.0.0

servers:
  - url: https://fdm-gateway.example.com
    description: Production gateway

tags:
  - name: fdm-products
    description: Сервис управления продуктами
  - name: capability-backend
    description: Сервис бизнес- и технических возможностей
  - name: techradar-backend
    description: Сервис реестра технологий
  - name: cx-backend
    description: Сервис customer experience
  - name: document-service
    description: Сервис управления документами
  - name: structurizr-backend
    description: Сервис интеграции с Structurizr
  - name: fdm-notifications-management
    description: Сервис управления уведомлениями
  - name: fdm-pack-loader
    description: Сервис загрузки пакетов
  - name: fdm-auth
    description: Сервис аутентификации и авторизации
  - name: architect-graph-service
    description: Сервис архитектурных графов

paths:
  # ============================================================================
  # fdm-products
  # ============================================================================

  /product/api/v1/product/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
        description: Код или alias продукта
    put:
      tags:
        - fdm-products
      summary: Создание/обновление продукта по коду
      description: Создание или обновление продукта по коду (alias).
      operationId: createOrUpdateProductByCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      responses:
        '200':
          description: Успешное выполнение
        '400':
          description: Ошибка валидации
        '404':
          description: Продукт не найден
        '409':
          description: Конфликт

    get:
      tags:
        - fdm-products
      summary: Информация о продукте
      description: Возвращает информацию о продукте, включая список технологий.
      operationId: getProductByCode
      responses:
        '200':
          description: Успешное выполнение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductFull'
        '404':
          description: Продукт не найден

  /product/api/v1/product/{id}:
    delete:
      tags:
        - fdm-products
      summary: Удаление продукта
      description: Удаление продукта по ID (активно при app.force-app-delete=true).
      operationId: deleteProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Идентификатор продукта
      responses:
        '200':
          description: Успешное удаление
        '404':
          description: Продукт не найден

  /product/api/v1/products:
    get:
      tags:
        - fdm-products
      summary: Список продуктов
      description: Краткий список продуктов без structurizr-ключей.
      operationId: listProducts
      responses:
        '200':
          description: Успешное выполнение
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductShort'

  /product/api/v1/products/mnemonic:
    get:
      tags:
        - fdm-products
      summary: Все мнемоники продуктов
      description: Возвращает все мнемоники продуктов.
      operationId: listProductMnemonics
      responses:
        '200':
          description: Успешное выполнение
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /product/api/v1/product/{code}/relations:
    put:
      tags:
        - fdm-products
      summary: Создание/обновление связей продукта
      description: Создание/обновление связей (контейнеры, интерфейсы, методы).
      operationId: updateProductRelations
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: Код/alias продукта
        - name: source
          in: query
          required: false
          schema:
            type: string
          description: Источник данных связей
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Container'
      responses:
        '200':
          description: Успешное выполнение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '207':
          description: Ошибки валидации связей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '400':
          description: Ошибка валидации

  /product/api/v1/product-tech-relation/{techId}:
    post:
      tags:
        - fdm-products
      summary: Связь технологии и продукта
      description: Добавляет связь продукта с технологией по techId.
      operationId: linkProductToTech
      parameters:
        - name: techId
          in: path
          required: true
          schema:
            type: integer
          description: Идентификатор технологии
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductTechRelation'
      responses:
        '200':
          description: Успешное выполнение
        '400':
          description: Ошибка валидации
        '404':
          description: Технология или продукт не найдены

  
  # ============================================================================
  # capability-backend
  # ============================================================================
  /capability/api/v1/business-capability:
    put:
      tags:
        - capability-backend
      summary: Создание/обновление бизнес-возможности
      description: Создаёт или обновляет BC с учётом прав пользователя.
      operationId: createOrUpdateBusinessCapability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessCapability'
      responses:
        '200':
          description: Успешное выполнение
        '400':
          description: Ошибка валидации
        '403':
          description: Недостаточно прав
        '409':
          description: Конфликт

    get:
      tags:
        - capability-backend
      summary: Список бизнес-возможностей
      description: Возвращает список BC с пагинацией.
      operationId: listBusinessCapabilities
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
          description: Лимит записей
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Смещение
        - name: findBy
          in: query
          required: false
          schema:
            type: string
            default: ALL
          description: Режим выборки
      responses:
        '200':
          description: Успешное выполнение
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BusinessCapabilityShort'

  /capability/api/v1/tech-capabilities:
    put:
      tags:
        - capability-backend
      summary: Создание/обновление технической возможности
      description: Создаёт или обновляет TC.
      operationId: createOrUpdateTechCapability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TechCapability'
      responses:
        '200':
          description: Успешное выполнение
        '400':
          description: Ошибка валидации
        '409':
          description: Конфликт

    get:
      tags:
        - capability-backend
      summary: Список технических возможностей
      description: Возвращает постраничный список TC.
      operationId: listTechCapabilities
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
          description: Лимит записей
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Смещение
      responses:
        '200':
          description: Успешное выполнение
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TechCapability'

  /capability/api/v1/criterias:
    put:
      tags:
        - capability-backend
      summary: Создание/обновление критерия оценки
      description: Создаёт или обновляет критерий оценки TC/BC в справочнике.
      operationId: createOrUpdateCriterion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - description
                - interval
                - minDesc
                - maxDesc
              properties:
                name:
                  type: string
                  description: Название критерия
                description:
                  type: string
                  description: Описание критерия
                type:
                  type: string
                  description: Тип критерия
                interval:
                  type: integer
                  description: Интервал оценки
                threshold:
                  type: integer
                  description: Пороговое значение
                revers:
                  type: boolean
                  description: Флаг реверса (по умолчанию false)
                minDesc:
                  type: string
                  description: Описание минимального значения
                maxDesc:
                  type: string
                  description: Описание максимального значения
      responses:
        '200':
          description: Успешное выполнение
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Идентификатор критерия
                  name:
                    type: string
                    description: Название критерия
                  description:
                    type: string
                    description: Описание критерия
                  type:
                    type: string
                    description: Тип критерия
                  interval:
                    type: integer
                    description: Интервал оценки
                  threshold:
                    type: integer
                    description: Пороговое значение
                  revers:
                    type: boolean
                    description: Флаг реверса
                  minDesc:
                    type: string
                    description: Описание минимального значения
                  maxDesc:
                    type: string
                    description: Описание максимального значения
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorMessage:
                    type: string
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorMessage:
                    type: string

    post:
      tags:
        - capability-backend
      summary: Создание/обновление записи о критерии для BC/TC
      description: Создаёт или обновляет запись о критерии оценки для бизнес- или технической возможности.
      operationId: createOrUpdateCriterionAssignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - code
                - criterionName
                - value
              properties:
                type:
                  type: string
                  enum:
                    - business_capability
                    - tech_capability
                  description: Тип сущности
                code:
                  type: string
                  description: Код сущности (BC или TC)
                criterionName:
                  type: string
                  description: Название критерия
                value:
                  type: integer
                  description: Значение оценки
                grade:
                  type: integer
                  description: Оценка (может быть null)
                comment:
                  type: string
                  description: Комментарий (может быть null)
      responses:
        '200':
          description: Успешное выполнение
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Идентификатор записи
                  criterion_id:
                    type: integer
                    description: Идентификатор критерия
                  value:
                    type: integer
                    description: Значение оценки
                  grade:
                    type: integer
                    description: Оценка
                  tcId:
                    type: integer
                    description: Идентификатор TC (для tech_capability)
                  bcId:
                    type: integer
                    description: Идентификатор BC (для business_capability)
                  comment:
                    type: string
                    description: Комментарий
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorMessage:
                    type: string

  # ============================================================================
  # techradar-backend
  # ============================================================================
  /techradar/api/v1/tech:
    post:
      tags:
        - techradar-backend
      summary: Пакетное создание технологий
      description: Пакетное создание технологий. Доступно только роли ADMINISTRATOR.
      operationId: createTechnologies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/TechCreate'
      responses:
        '201':
          description: Успешное создание
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TechCreated'
        '400':
          description: Ошибка валидации
        '403':
          description: Недостаточно прав
        '409':
          description: Конфликт (дубликат label)

    get:
      tags:
        - techradar-backend
      summary: Список технологий
      description: Возвращает список технологий с версиями и историей.
      operationId: listTechnologies
      parameters:
        - name: actualTech
          in: query
          required: false
          schema:
            type: boolean
          description: Фильтр только актуальных технологий
      responses:
        '200':
          description: Успешное выполнение
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TechAdvanced'

  # ============================================================================
  # cx-backend
  # ============================================================================
  /cx/api/v1/product/{productId}/cj:
    post:
      tags:
        - cx-backend
      summary: Создание CJ для продукта
      description: Создаёт новый CJ для указанного продукта.
      operationId: createCJ
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
          description: Идентификатор продукта
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CJCreate'
      responses:
        '200':
          description: Успешное выполнение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CJ'
        '400':
          description: Ошибка валидации
        '403':
          description: Недостаточно прав
        '404':
          description: Продукт не найден

  /cx/api/v1/product/cj/{id}:
    get:
      tags:
        - cx-backend
      summary: CJ по идентификатору
      description: Возвращает полное представление CJ по идентификатору.
      operationId: getCJById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Идентификатор CJ
      responses:
        '200':
          description: Успешное выполнение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CJFull'
        '403':
          description: Недостаточно прав
        '404':
          description: CJ не найден

  # ============================================================================
  # document-service
  # ============================================================================
  /document/api/v1/documents/{id}:
    get:
      tags:
        - document-service
      summary: Скачивание документа
      description: Скачивание файла документа по внутреннему id.
      operationId: downloadDocument
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Идентификатор документа
      responses:
        '200':
          description: Успешное выполнение
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          description: Недостаточно прав
        '404':
          description: Документ не найден
        '503':
          description: Ошибка MinIO

  /document/api/v1/documents/{path_name}/{doc_type}:
    post:
      tags:
        - document-service
      summary: Загрузка документа
      description: Загрузка документа (multipart) в каталог.
      operationId: uploadDocument
      parameters:
        - name: path_name
          in: path
          required: true
          schema:
            type: string
          description: Имя каталога
        - name: doc_type
          in: path
          required: true
          schema:
            type: string
          description: Тип документа
        - name: isPublic
          in: query
          required: false
          schema:
            type: boolean
          description: Публичный документ
        - name: targetId
          in: query
          required: false
          schema:
            type: integer
          description: Идентификатор целевой сущности
        - name: ttl
          in: query
          required: false
          schema:
            type: integer
          description: Срок жизни в сутках
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Успешное создание
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentCreated'
        '400':
          description: Ошибка валидации
        '403':
          description: Недостаточно прав
        '404':
          description: Документ не найден
        '503':
          description: Ошибка MinIO

  # ============================================================================
  # structurizr-backend
  # ============================================================================
  /structurizr-backend/api/v1/workspace:
    post:
      tags:
        - structurizr-backend
      summary: Создание Structurizr workspace
      description: Создание Structurizr workspace, публикация шаблона.
      operationId: createWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceCreate'
      responses:
        '200':
          description: Успешное выполнение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          description: Ошибка валидации
        '404':
          description: Продукт не найден
        '422':
          description: Невалидный запрос
        '409':
          description: Конфликт

  # ============================================================================
  # fdm-pack-loader
  # ============================================================================
  /package/api/v1/packages-list:
    get:
      tags:
        - fdm-pack-loader
      summary: Список пакетов
      description: Постраничный список пакетов с фильтрацией по статусу.
      operationId: listPackages
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - none
              - SUCCESS
              - ERROR
              - WARNING
              - PROCESS
            default: none
          description: Статус пакета
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 15
          description: Лимит записей
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Смещение
      responses:
        '200':
          description: Успешное выполнение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackagesPage'
        '403':
          description: Недостаточно прав

  # ============================================================================
  # architect-graph-service
  # ============================================================================
  /arch-graph/api/v1/elements:
    get:
      tags:
        - architect-graph-service
      summary: Выполнение Cypher-запроса
      description: Выполнение произвольного Cypher-запроса к Neo4j.
      operationId: executeCypherQuery
      parameters:
        - name: CYPHER-QUERY
          in: header
          required: true
          schema:
            type: string
          description: Текст запроса Cypher
      responses:
        '200':
          description: Успешное выполнение
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '400':
          description: Ошибка валидации
        '403':
          description: Недостаточно прав
        '404':
          description: Не найдено
        '503':
          description: Neo4j недоступен

  # ============================================================================
  # fdm-auth
  # ============================================================================
  /user/api/v1/user/{id}:
    get:
      tags:
        - fdm-auth
      summary: Получить информацию о пользователе по ID
      description: Получение информации о пользователе по его ID.
      operationId: getUserById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID пользователя
      responses:
        '200':
          description: Успешное выполнение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserFull'
        '404':
          description: Пользователь не найден

  /user/api/v1/user:
    get:
      tags:
        - fdm-auth
      summary: Получить информацию о пользователе
      description: Получение информации о текущем авторизованном пользователе.
      operationId: getCurrentUser
      responses:
        '200':
          description: Успешное выполнение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserFull'

  /user/api/v1/users:
    get:
      tags:
        - fdm-auth
      summary: Получить список пользователей
      description: Получение списка всех пользователей.
      operationId: listUsers
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Номер страницы
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: Размер страницы
      responses:
        '200':
          description: Успешное выполнение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'

    post:
      tags:
        - fdm-auth
      summary: Создать пользователя
      description: Создание нового пользователя.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreated'
        '400':
          description: Ошибка валидации
        '409':
          description: Пользователь с таким логином уже существует

  /user/api/admin/v1/roles:
    get:
      tags:
        - fdm-auth
      summary: Получить список ролей
      description: Получение списка всех ролей системы.
      operationId: listRoles
      responses:
        '200':
          description: Успешное выполнение
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'

    post:
      tags:
        - fdm-auth
      summary: Создать роль
      description: Создание новой роли в системе.
      operationId: createRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreate'
      responses:
        '201':
          description: Роль создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          description: Ошибка валидации
        '409':
          description: Роль с таким названием уже существует

  /user/api/admin/v1/roles/{id}:
    get:
      tags:
        - fdm-auth
      summary: Получить роль по ID
      description: Получение информации о роли по её ID.
      operationId: getRoleById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID роли
      responses:
        '200':
          description: Успешное выполнение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '404':
          description: Роль не найдена

    delete:
      tags:
        - fdm-auth
      summary: Удалить роль
      description: Удаление роли по её ID.
      operationId: deleteRole
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID роли
      responses:
        '204':
          description: Роль удалена
        '404':
          description: Роль не найдена

  /user/api/admin/v1/roles/{id}/permissions:
    put:
      tags:
        - fdm-auth
      summary: Обновить разрешения роли
      description: Обновление списка разрешений для роли.
      operationId: updateRolePermissions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID роли
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                permissions:
                  type: array
                  items:
                    type: string
                  description: Список названий разрешений
      responses:
        '200':
          description: Успешное выполнение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          description: Ошибка валидации
        '404':
          description: Роль не найдена

