sla: 1.0.0 # версия формата SLA
info: # описание 
  title: Шаблон SLA для описания НФТ продукта
  description: Описание содержимого
  version: 0.0.1 #версия SLA
rest: # Протокол. В текущей версии поддерживается rest и soap
  fdmshowcaseapp.container_api.fdm_interface: #идентификатор REST API. Этот ключ определяет переменную в пространстве structurizr, с которой связаны данные НФТ
      "/api/v1/systems/{code}" : # endpoint предоставляемого метода
        get: # http метод интерфейса
          rps: 10 # Максимальная нагрузка. ПО умолчанию запросов в секунду
          latency: 200 # Максимальное время отклика в миллисекунах
          error_rate: 0.5 # максимально допустимый процент ошибок при вызове (например, 0.05)
        put:
          rps: 20
          latency: 1500
      "/api/capabilities" : # endpoint предоставляемого метода
        get: # http метод интерфейса
          rps: 20 # Максимальная нагрузка. ПО умолчанию запросов в секунду
          latency: 1000 # Максимальное время отклика в миллисекунах
          error_rate: 0.1 # максимально допустимый процент ошибок при вызове (например, 0.05)

soap:
  soap_api_sample:
    GroupAccountCreate: # Для SOAP: Название метода
      rps: 200
      latency: 200
      error_rate: 95